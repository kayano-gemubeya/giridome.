
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101323">
  <meta name="description" content="10回勝負のギリギリストップゲーム「ギリ止め。」">
  <title>ギリ止め。</title>

  <style>
    :root {
      --bg: #101323;
      --panel: #191e34;
      --text: #f5f6ff;
      --muted: #a8aecb;
      --green: #68f5a5;
      --pink: #ff6eab;
      --blue: #7a8cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px 36px;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #29234c 0%, transparent 55%),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      text-align: center;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .logo {
      margin: 10px 0 4px;
      font-size: clamp(38px, 10vw, 58px);
      font-weight: 1000;
      letter-spacing: -3px;
      line-height: 1.15;
    }

    .logo span {
      color: var(--green);
    }

    .subtitle {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 22px 16px;
      border: 1px solid #ffffff15;
      border-radius: 24px;
      background: linear-gradient(145deg, #202641, #171b2e);
      box-shadow: 0 18px 50px #0003;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 26px;
    }

    .stat {
      padding: 12px 5px;
      border-radius: 14px;
      background: #0d1122;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .status {
      min-height: 48px;
      margin: 8px 0 18px;
    }

    .status-main {
      font-size: 19px;
      font-weight: 900;
    }

    .status-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .meter {
      position: relative;
      width: min(72vw, 290px);
      aspect-ratio: 1;
      margin: 0 auto 22px;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          #252b48 0deg,
          #252b48 360deg
        );
      box-shadow:
        inset 0 0 30px #0005,
        0 0 32px #7a8cff0d;
    }

    .meter::before {
      position: absolute;
      inset: 13px;
      content: "";
      border: 1px solid #ffffff14;
      border-radius: 50%;
    }

    .target {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from var(--target-start, 120deg),
        transparent 0deg,
        transparent var(--target-start, 120deg),
        #68f5a5 0deg,
        #b8ffd5 3deg,
        #68f5a5 6deg,
        transparent 7deg,
        transparent 360deg
      );
      opacity: 0;
      transition: opacity 0.2s;
    }

    .target.visible {
      opacity: 1;
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 43%;
      border-radius: 8px;
      background: linear-gradient(to top, var(--pink), #fff);
      transform-origin: center bottom;
      transform: translate(-50%, -100%) rotate(0deg);
      box-shadow: 0 0 14px #ff6eab8a;
      z-index: 2;
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--pink);
      transform: translate(-50%, -50%);
      z-index: 3;
      box-shadow: 0 0 15px #ff6eab88;
    }

    .meter-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 800;
      color: #d9defa;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .result-number {
      min-height: 54px;
      margin: 0 0 10px;
      font-size: 44px;
      line-height: 1.2;
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .result-number small {
      font-size: 16px;
      color: var(--muted);
    }

    .rank {
      min-height: 28px;
      margin-bottom: 16px;
      color: var(--green);
      font-weight: 900;
      font-size: 18px;
    }

    .main-button {
      width: 100%;
      min-height: 64px;
      border: 0;
      border-radius: 18px;
      color: #101323;
      background: linear-gradient(135deg, #83ffc0, #4eea9b);
      box-shadow: 0 7px 0 #269d67, 0 12px 25px #46ef9b20;
      font-size: 21px;
      font-weight: 1000;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .main-button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #269d67;
    }

    .main-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .secondary-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary-button {
      min-height: 48px;
      border: 1px solid #ffffff1b;
      border-radius: 14px;
      color: var(--text);
      background: #ffffff09;
      font-weight: 800;
    }

    .secondary-button:active {
      transform: scale(0.98);
    }

    .help {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .help strong {
      color: var(--text);
    }

    .history-title {
      margin: 26px 0 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
    }

    .history-item {
      min-width: 43px;
      padding: 7px 9px;
      border: 1px solid #ffffff15;
      border-radius: 10px;
      background: #ffffff08;
      font-size: 12px;
      font-weight: 800;
    }

    .history-item.good {
      color: var(--green);
    }

    .history-item.bad {
      color: var(--pink);
    }

    .footer {
      margin-top: 24px;
      color: #747b9c;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 360px) {
      .panel {
        padding: 18px 12px;
      }

      .stat-value {
        font-size: 21px;
      }

      .main-button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="logo">ギリ<span>止め。</span></h1>
    <p class="subtitle">止めるなら、ギリギリを狙え。</p>

    <section class="panel">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">ROUND</div>
          <div class="stat-value" id="round">0/10</div>
        </div>
        <div class="stat">
          <div class="stat-label">SCORE</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">BEST</div>
          <div class="stat-value" id="best">0</div>
        </div>
      </div>

      <div class="status">
        <div class="status-main" id="statusMain">準備はいい？</div>
        <div class="status-sub" id="statusSub">
          緑のゾーンで止めると高得点！
        </div>
      </div>

      <div class="meter" id="meter">
        <div class="target" id="target"></div>
        <div class="needle" id="needle"></div>
        <div class="hub"></div>
        <div class="meter-label" id="meterLabel">READY</div>
      </div>

      <div class="result-number" id="lastScore">---</div>
      <div class="rank" id="rank">目指せ、神ギリ。</div>

      <button class="main-button" id="mainBtn">
        ゲームスタート
      </button>

      <div class="secondary-buttons">
        <button class="secondary-button" id="shareBtn">
          𝕏 結果をシェア
        </button>
        <button class="secondary-button" id="resetBtn">
          もう一度遊ぶ
        </button>
      </div>

      <div class="history-title">今回の記録</div>
      <div class="history" id="history">
        <span class="history-item">まだ記録なし</span>
      </div>
    </section>

    <div class="help">
      <strong>遊び方</strong><br>
      ①「ゲームスタート」を押す<br>
      ②針が回り始めたら、緑のゾーンで止める！<br>
      ③全10回の合計スコアで勝負<br>
      <strong>中心に近いほど高得点！</strong>
    </div>

    <div class="footer">
      ギリ止め。｜10回勝負、あなたは何点？
    </div>
  </main>

  <script>
    const GAME_URL = 'https://kayano-gemubeya.github.io/giridome./';

    const $ = (id) => document.getElementById(id);

    let playing = false;
    let gameOver = false;
    let round = 0;
    let score = 0;
    let best = Number(localStorage.getItem('giridome_best') || 0);
    let angle = 0;
    let speed = 3.5;
    let animationId = null;
    let targetCenter = 0;
    let targetWidth = 30;
    let results = [];
    let lastRoundScore = null;
    let lastTimestamp = 0;

    $('best').textContent = best;

    function normalizeAngle(value) {
      return ((value % 360) + 360) % 360;
    }

    function angleDistance(a, b) {
      let difference = Math.abs(normalizeAngle(a) - normalizeAngle(b));
      return Math.min(difference, 360 - difference);
    }

    function setStatus(main, sub) {
      $('statusMain').textContent = main;
      $('statusSub').textContent = sub;
    }

    function setNeedle(value) {
      $('needle').style.transform =
        `translate(-50%, -100%) rotate(${value}deg)`;
    }

    function setTarget() {
      targetCenter = Math.random() * 300 + 30;
      targetWidth = Math.max(12, 32 - round * 1.5);

      const start = targetCenter - targetWidth / 2;

      $('target').style.background = `
        conic-gradient(
          from ${start}deg,
          transparent 0deg,
          transparent ${targetWidth}deg,
          #68f5a5 ${targetWidth}deg,
          transparent ${targetWidth + 1}deg,
          transparent 360deg
        )
      `;

      $('target').style.transform = 'rotate(0deg)';
      $('target').classList.add('visible');

      // 緑のゾーンは針の角度と同じ基準で描画
      $('target').style.background = `
        conic-gradient(
          ${start}deg,
          transparent 0deg,
          transparent 0deg,
          #68f5a5 0deg,
          #b8ffd5 ${targetWidth / 2}deg,
          #68f5a5 ${targetWidth}deg,
          transparent ${targetWidth + 0.5}deg,
          transparent 360deg
        )
      `;

      // CSS conic-gradientの開始角度を調整
      $('target').style.background = `
        conic-gradient(
          from ${start}deg,
          #68f5a5 0deg,
          #b8ffd5 ${targetWidth / 2}deg,
          #68f5a5 ${targetWidth}deg,
          transparent ${targetWidth + 0.5}deg,
          transparent 360deg
        )
      `;
    }

    function getRank(total) {
      if (total >= 950) return '伝説のギリ止め神';
      if (total >= 850) return '神ギリ';
      if (total >= 700) return 'ギリ止め職人';
      if (total >= 500) return 'なかなかの実力';
      if (total >= 300) return 'あと一歩！';
      return 'まだまだ修行中';
    }

    function updateDisplay() {
      $('round').textContent = `${round}/10`;
      $('score').textContent = score;
      $('best').textContent = best;
    }

    function renderHistory() {
      const history = $('history');
      history.innerHTML = '';

      if (results.length === 0) {
        const item = document.createElement('span');
        item.className = 'history-item';
        item.textContent = 'まだ記録なし';
        history.appendChild(item);
        return;
      }

      results.forEach((value, index) => {
        const item = document.createElement('span');
        item.className = 'history-item ' + (value >= 80 ? 'good' : 'bad');
        item.textContent = `${index + 1}: ${value}`;
        history.appendChild(item);
      });
    }

    function startGame() {
      cancelAnimationFrame(animationId);

      playing = false;
      gameOver = false;
      round = 0;
      score = 0;
      angle = Math.random() * 360;
      speed = 3.5;
      results = [];
      lastRoundScore = null;

      $('lastScore').textContent = '---';
      $('rank').textContent = '目指せ、神ギリ。';
      $('meterLabel').textContent = 'STOP!';
      $('mainBtn').textContent = '止めろ！';
      $('mainBtn').disabled = false;

      updateDisplay();
      renderHistory();
      nextRound();
    }

    function nextRound() {
      if (round >= 10) {
        finishGame();
        return;
      }

      round++;
      speed = 3.2 + round * 0.25;
      angle = Math.random() * 360;

      setTarget();
      setNeedle(angle);
      updateDisplay();

      playing = true;
      lastTimestamp = 0;

      setStatus(`ROUND ${round}`, '緑のゾーンを狙ってタップ！');
      $('meterLabel').textContent = 'STOP!';
      $('mainBtn').textContent = 'ここで止める！';

      animationId = requestAnimationFrame(animate);
    }

    function animate(timestamp) {
      if (!playing) return;

      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = Math.min(timestamp - lastTimestamp, 40);
      lastTimestamp = timestamp;

      angle = normalizeAngle(angle + speed * delta / 16.67);
      setNeedle(angle);

      animationId = requestAnimationFrame(animate);
    }

    function stopNeedle() {
      if (!playing || gameOver) return;

      playing = false;
      cancelAnimationFrame(animationId);

      const distance = angleDistance(angle, targetCenter);
      const halfWidth = targetWidth / 2;

      let points;

      if (distance <= halfWidth) {
        points = Math.round(100 - (distance / halfWidth) * 20);
      } else {
        const miss = distance - halfWidth;
        points = Math.max(0, Math.round(80 - miss * 1.5));
      }

      points = Math.min(100, Math.max(0, points));
      score += points;
      results.push(points);
      lastRoundScore = points;

      $('lastScore').innerHTML = `${points}<small> 点</small>`;
      $('rank').textContent = points >= 95
        ? '神ギリ！！'
        : points >= 80
          ? 'うますぎ！'
          : points >= 50
            ? '惜しい！'
            : '次こそ！';

      $('meterLabel').textContent = `${points}点`;

      if (points >= 80) {
        setStatus('ナイスストップ！', `中心から ${Math.round(distance)}°`);
      } else {
        setStatus('止めた！', `中心から ${Math.round(distance)}°`);
      }

      updateDisplay();
      renderHistory();

      $('mainBtn').textContent =
        round >= 10 ? '結果を見る' : '次のラウンドへ';
    }

    function finishGame() {
      playing = false;
      gameOver = true;
      cancelAnimationFrame(animationId);

      if (score > best) {
        best = score;
        localStorage.setItem('giridome_best', String(best));
      }

      updateDisplay();

      setStatus('10回終了！', `合計 ${score} 点！`);
      $('lastScore').innerHTML = `${score}<small> 点</small>`;
      $('rank').textContent = getRank(score);
      $('meterLabel').textContent = 'FINISH';
      $('mainBtn').textContent = 'もう一度挑戦';
      $('mainBtn').disabled = false;
      $('target').classList.remove('visible');
    }

    $('mainBtn').addEventListener('click', () => {
      if (gameOver) {
        startGame();
        return;
      }

      if (playing) {
        stopNeedle();
        return;
      }

      if (round === 0) {
        startGame();
        return;
      }

      if (round >= 10) {
        finishGame();
        return;
      }

      nextRound();
    });

    $('resetBtn').addEventListener('click', () => {
      startGame();
    });

    // Xの投稿文にゲームURLを必ず含める
    $('shareBtn').addEventListener('click', () => {
      const gameUrl = GAME_URL;

      const shareScore = score;
      const shareRank = $('rank').textContent;

      const msg =
        `「ギリ止め。」で${shareScore}点！\n` +
        `称号：${shareRank}\n\n` +
        `👇ここで遊べる！\n${gameUrl}\n\n` +
        `10回勝負、あなたは何点？\n` +
        `#ギリ止め`;

      const shareUrl =
        'https://twitter.com/intent/tweet?text=' +
        encodeURIComponent(msg);

      window.open(shareUrl, '_blank', 'noopener,noreferrer');
    });

    // 最初の表示
    updateDisplay();
    renderHistory();
    setNeedle(0);
  </script>
</body>
</html>
